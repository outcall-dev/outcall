[package]
name = "outcall"
version = "0.1.36"
edition = "2024"
description = "CLI client for outcalld"
license = "Apache-2.0"

[lints]
workspace = true

[dependencies]
outcall-api = { path = "../outcall-api", version = "0.1.35" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
thiserror = "2"
rcgen = "0.14"
time = "0.3"
getrandom = "0.2"
percent-encoding = "2"
sha2 = "0.10"
httparse = "1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["fs", "process", "signal", "user"] }

[dev-dependencies]
tempfile = "3"
