[package]
name = "outcall"
version = "0.1.0"
edition = "2024"
description = "CLI client for outcalld"
license = "Apache-2.0"

[dependencies]
outcall-api = { path = "../outcall-api", version = "0.1.0" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rcgen = "0.14"
time = "0.3"
