[package]
name = "outcall-agent"
version = "0.1.26"
edition = "2024"
description = "Agent shim for Outcall (runs inside containers)"
license = "Apache-2.0"

[dependencies]
outcall-api = { path = "../outcall-api", version = "0.1.25" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
