[package]
name = "outcalld"
version = "0.1.36"
edition = "2021"
description = "Host-level firewall daemon for Outcall"
license = "Apache-2.0"

[lints]
workspace = true

[lib]
name = "outcalld"
path = "src/lib.rs"

[[bin]]
name = "outcalld"
path = "src/main.rs"

[dependencies]
outcall-api = { path = "../outcall-api", version = "0.1.35" }
outcall-ui = { path = "../outcall-ui", version = "0.1.35" }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
cel-interpreter = { package = "cel", version = "0.14.3" }
x509-parser = "0.18"
httparse = "1"
url = "2"
ipnet = "2"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["fs"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }
rtnetlink = "0.23"
futures = "0.3"
hickory-server = { version = "=0.26.1", features = ["resolver"] }
hickory-resolver = "=0.26.1"
hickory-proto = "=0.26.1"
hickory-net = "=0.26.1"
lru = "0.18.2"
async-trait = "0.1"
bollard = "0.18"
getrandom = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
rcgen = "0.14"
bollard = "0.18"
futures = "0.3"
getrandom = "0.2"
hickory-proto = "=0.26.1"
hickory-server = { version = "=0.26.1", features = ["resolver"] }
hickory-resolver = "=0.26.1"
hickory-net = "=0.26.1"
lru = "0.18.2"
async-trait = "0.1"
