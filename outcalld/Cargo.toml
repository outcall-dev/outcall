[package]
name = "outcalld"
version = "0.1.22"
edition = "2021"
description = "Host-level firewall daemon for Outcall"
license = "Apache-2.0"

[lib]
name = "outcalld"
path = "src/lib.rs"

[[bin]]
name = "outcalld"
path = "src/main.rs"

[dependencies]
outcall-api = { path = "../outcall-api", version = "0.1.22" }
outcall-ui = { path = "../outcall-ui", version = "0.1.22" }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
cel-interpreter = "0.8"
walkdir = "2"
regex = "1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
rtnetlink = "0.21"
futures = "0.3"
hickory-server = { version = "=0.26.1", features = ["resolver"] }
hickory-resolver = "=0.26.1"
hickory-proto = "=0.26.1"
hickory-net = "=0.26.1"
lru = "0.17"
async-trait = "0.1"
bollard = "0.18"
getrandom = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
