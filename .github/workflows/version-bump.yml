name: Version Bump

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get current version
        id: current
        run: |
          version=$(grep '^version = ' outcall/Cargo.toml | head -1 | sed 's/version = "//g' | sed 's/"//g' | tr -d ' ')
          echo "current=$version" >> $GITHUB_OUTPUT

      - name: Compute new version
        env:
          VERSION_TYPE: ${{ github.event.inputs.version_type }}
          CURRENT: ${{ steps.current.outputs.current }}
        id: bump
        run: |
          IFS='.' read -r major minor patch <<< "$CURRENT"
          case "$VERSION_TYPE" in
            major) new_major=$((major + 1)); new_minor=0; new_patch=0 ;;
            minor) new_major=$major; new_minor=$((minor + 1)); new_patch=0 ;;
            patch) new_major=$major; new_minor=$minor; new_patch=$((patch + 1)) ;;
          esac
          new_version="${new_major}.${new_minor}.${new_patch}"
          echo "new_version=$new_version" >> $GITHUB_OUTPUT

      - name: Create bumped branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "bump/${{ steps.bump.outputs.new_version }}"

      - name: Update versioned files
        run: |
          NEW_VERSION='${{ steps.bump.outputs.new_version }}'
          for file in outcall/Cargo.toml outcall-agent/Cargo.toml outcall-api/Cargo.toml outcall-ui/Cargo.toml outcalld/Cargo.toml; do
            sed -i "s/^version = \".*\"/version = \"$NEW_VERSION\"/" "$file"
          done
          sed -E -i "s/(OUTCALL_VERSION:-)[0-9]+\.[0-9]+\.[0-9]+/\1$NEW_VERSION/" scripts/install.sh
          sed -i "s/version-[0-9][0-9A-Za-z.]*-blue/version-$NEW_VERSION-blue/" README.md
          cargo update --workspace
          sh -n scripts/install.sh
          grep -F "VERSION=\"\${OUTCALL_VERSION:-$NEW_VERSION}\"" scripts/install.sh
          git add outcall/Cargo.toml outcall-agent/Cargo.toml outcall-api/Cargo.toml outcall-ui/Cargo.toml outcalld/Cargo.toml Cargo.lock scripts/install.sh README.md
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }}"

      - name: Push branch
        run: |
          git push origin "bump/${{ steps.bump.outputs.new_version }}"

      - name: Create PR
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
        run: |
          compare_url="https://github.com/${GITHUB_REPOSITORY}/compare/main...bump/${NEW_VERSION}?expand=1"
          if pr_output="$(gh pr create \
            --title "chore: bump version to $NEW_VERSION" \
            --body "Version bump PR for v$NEW_VERSION. Will trigger tag-on-merge on merge to main." \
            --base main \
            --head "bump/$NEW_VERSION" 2>&1)"; then
            printf '%s\n' "$pr_output"
          else
            printf '%s\n' "$pr_output" >&2
            case "$pr_output" in
              *"GitHub Actions is not permitted to create or approve pull requests"*)
                echo "::warning title=Manual pull request required::Repository policy blocked PR creation. Open $compare_url"
                printf '### Manual pull request required\n\nRepository policy does not allow GitHub Actions to create pull requests.\n\n[Open the version bump pull request](%s)\n' \
                  "$compare_url" >> "$GITHUB_STEP_SUMMARY"
                ;;
              *)
                exit 1
                ;;
            esac
          fi
