name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build, e.g. v0.1.24'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: outcall-dev/outcalld
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  security-gate:
    name: require successful security CI
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
      checks: read
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Resolve release commit
        id: release
        run: echo "sha=$(git rev-list -n 1 "$RELEASE_TAG")" >> "$GITHUB_OUTPUT"

      - name: Wait for exact-commit security gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTCALL_RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: bash scripts/verify-release-security-gate.sh

  build:
    name: build ${{ matrix.target }}
    needs: security-gate
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "stable"
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Install cross
        if: matrix.runner == 'ubuntu-latest'
        run: cargo install cross

      - name: Build release
        run: |
          cargo fetch --locked
          ${{ matrix.runner == 'ubuntu-latest' && 'cross' || 'cargo' }} build --release --workspace --locked --target ${{ matrix.target }}

      - name: Package binaries
        shell: bash
        run: |
          mkdir -p release/${{ matrix.target }}
          cp target/${{ matrix.target }}/release/outcall release/${{ matrix.target }}/
          cp target/${{ matrix.target }}/release/outcalld release/${{ matrix.target }}/
          cp target/${{ matrix.target }}/release/outcall-agent release/${{ matrix.target }}/
          cp README.md release/${{ matrix.target }}/ || true
          tar -czf release/${{ matrix.target }}.tar.gz -C release/${{ matrix.target }} .
          checksum_file=release/${{ matrix.target }}.tar.gz.sha256
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum release/${{ matrix.target }}.tar.gz > "$checksum_file"
          else
            shasum -a 256 release/${{ matrix.target }}.tar.gz > "$checksum_file"
          fi

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: RELEASE_NOTES_${{ env.RELEASE_TAG }}.md
          prerelease: true
          files: |
            release/${{ matrix.target }}.tar.gz
            release/${{ matrix.target }}.tar.gz.sha256
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    name: publish container image
    needs: security-gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # This workflow is dispatched from main and checks out RELEASE_TAG.
            # Use the explicit input rather than the dispatch ref, which is main.
            type=raw,value=${{ env.RELEASE_TAG }}
            type=raw,value=latest

      - name: Start container release timer
        id: container_timer
        shell: bash
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub-hosted builders are ephemeral. Keep the multi-architecture
          # Rust compilation cache scoped to this release image across tags.
          cache-from: type=gha,scope=outcalld-release
          # A cache outage must not prevent publishing verified release assets.
          cache-to: type=gha,scope=outcalld-release,mode=max,ignore-error=true

      - name: Verify release-tag image manifest
        run: docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:${RELEASE_TAG}" > /dev/null

      - name: Export amd64 daemon image archive
        run: |
          mkdir -p release
          # Export the already-published manifest variant. Rebuilding here repeats
          # the expensive cross-platform daemon compilation for each archive.
          image="${REGISTRY}/${IMAGE_NAME}:${RELEASE_TAG}"
          docker pull --platform linux/amd64 "$image"
          docker image save "$image" -o release/outcalld-image-linux-amd64.tar
          gzip -f release/outcalld-image-linux-amd64.tar
          sha256sum release/outcalld-image-linux-amd64.tar.gz > release/outcalld-image-linux-amd64.tar.gz.sha256

      - name: Export arm64 daemon image archive
        run: |
          image="${REGISTRY}/${IMAGE_NAME}:${RELEASE_TAG}"
          docker pull --platform linux/arm64 "$image"
          docker image save "$image" -o release/outcalld-image-linux-arm64.tar
          gzip -f release/outcalld-image-linux-arm64.tar
          sha256sum release/outcalld-image-linux-arm64.tar.gz > release/outcalld-image-linux-arm64.tar.gz.sha256

      - name: Upload daemon image archives to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            release/outcalld-image-linux-amd64.tar.gz
            release/outcalld-image-linux-amd64.tar.gz.sha256
            release/outcalld-image-linux-arm64.tar.gz
            release/outcalld-image-linux-arm64.tar.gz.sha256
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report container release duration
        if: always()
        env:
          STARTED_AT: ${{ steps.container_timer.outputs.started_at }}
          WARN_AFTER_SECONDS: 2700
        shell: bash
        run: |
          set -eu
          if [ -z "${STARTED_AT:-}" ]; then
            echo "Container release timer did not start." >&2
            exit 0
          fi
          elapsed_seconds=$(( $(date +%s) - STARTED_AT ))
          elapsed_minutes=$(( (elapsed_seconds + 59) / 60 ))
          echo "### Container release duration" >> "$GITHUB_STEP_SUMMARY"
          echo "${elapsed_minutes} minutes (${elapsed_seconds} seconds)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$elapsed_seconds" -gt "$WARN_AFTER_SECONDS" ]; then
            echo "::warning title=Slow container release::Container publish and archive export took ${elapsed_minutes} minutes (threshold: 45 minutes)."
          fi

  recipe-container:
    name: publish ${{ matrix.recipe }} recipe image
    needs: security-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        recipe: [claude, codex]
    env:
      RECIPE_IMAGE_NAME: outcall-dev/outcall-recipe-${{ matrix.recipe }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.RECIPE_IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }}
            type=raw,value=latest

      - name: Build and push recipe image
        uses: docker/build-push-action@v7
        with:
          context: recipe-images/${{ matrix.recipe }}
          file: recipe-images/${{ matrix.recipe }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=recipe-${{ matrix.recipe }}-release
          cache-to: type=gha,scope=recipe-${{ matrix.recipe }}-release,mode=max,ignore-error=true

      - name: Verify manifest and both architectures
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.RECIPE_IMAGE_NAME }}:${{ env.RELEASE_TAG }}
        run: |
          set -eu
          docker buildx imagetools inspect "$IMAGE" >/dev/null
          for platform in linux/amd64 linux/arm64; do
            docker pull --platform "$platform" "$IMAGE"
            docker run --rm --platform "$platform" "$IMAGE" --version
          done

  finalize:
    name: finalize release
    needs: [build, container, recipe-container]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release edit "$RELEASE_TAG"
          --repo "$GITHUB_REPOSITORY"
          --prerelease=false
          --latest
