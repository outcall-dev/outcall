name: Release Build

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "stable"
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Install cross
        if: matrix.runner == 'ubuntu-latest'
        run: cargo install cross

      - name: Build release
        run: |
          cargo fetch --locked
          ${{ matrix.runner == 'ubuntu-latest' && 'cross' || 'cargo' }} build --release --workspace --locked --target ${{ matrix.target }}

      - name: Package binaries
        run: |
          mkdir -p release/${{ matrix.target }}
          cp target/${{ matrix.target }}/release/outcall release/${{ matrix.target }}/
          cp target/${{ matrix.target }}/release/outcalld release/${{ matrix.target }}/
          cp README.md release/${{ matrix.target }}/ || true
          tar -czf release/${{ matrix.target }}.tar.gz -C release/${{ matrix.target }} .
          sha256sum release/${{ matrix.target }}.tar.gz > release/${{ matrix.target }}/SHA256SUMS.txt

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/${{ matrix.target }}.tar.gz
            release/${{ matrix.target }}/SHA256SUMS.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}