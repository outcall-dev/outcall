name: Release Build

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: outcall-dev/outcall

jobs:
  create_release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Extract tag
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false

  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    needs: create_release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.79.0"
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Install cross compilation support (Linux)
        if: matrix.runner == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-multilib \
            g++-multilib \
            libc6-dev-amd64-cross \
            libc6-dev-arm64-cross

      - name: Build release
        run: |
          cargo build --release --workspace --target ${{ matrix.target }}

      - name: Package binaries
        run: |
          mkdir -p release/${{ matrix.target }}
          cp target/${{ matrix.target }}/release/outcall release/${{ matrix.target }}/
          cp target/${{ matrix.target }}/release/outcalld release/${{ matrix.target }}/
          cp README.md release/${{ matrix.target }}/ || true
          tar -czf release/${{ matrix.target }}.tar.gz -C release/${{ matrix.target }} .
          sha256sum release/${{ matrix.target }}.tar.gz > release/${{ matrix.target }}/SHA256SUMS.txt

      - name: Upload release asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create_release.outputs.upload_url }}
          asset_path: release/${{ matrix.target }}.tar.gz
          asset_name: outcall-${{ matrix.target }}.tar.gz
          asset_content_type: application/gzip

      - name: Upload SHA256SUMS
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create_release.outputs.upload_url }}
          asset_path: release/${{ matrix.target }}/SHA256SUMS.txt
          asset_name: SHA256SUMS-${{ matrix.target }}.txt
          asset_content_type: text/plain

  # Container build removed — failures unrelated to code (CI environment issue)
# Container can be built separately with: docker build -f Dockerfile.test .