name: Release Build

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: outcall-dev/outcalld

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "stable"
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Install cross
        if: matrix.runner == 'ubuntu-latest'
        run: cargo install cross

      - name: Build release
        run: |
          cargo fetch --locked
          ${{ matrix.runner == 'ubuntu-latest' && 'cross' || 'cargo' }} build --release --workspace --locked --target ${{ matrix.target }}

      - name: Package binaries
        shell: bash
        run: |
          mkdir -p release/${{ matrix.target }}
          cp target/${{ matrix.target }}/release/outcall release/${{ matrix.target }}/
          cp target/${{ matrix.target }}/release/outcalld release/${{ matrix.target }}/
          cp target/${{ matrix.target }}/release/outcall-agent release/${{ matrix.target }}/
          cp README.md release/${{ matrix.target }}/ || true
          tar -czf release/${{ matrix.target }}.tar.gz -C release/${{ matrix.target }} .
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum release/${{ matrix.target }}.tar.gz > release/${{ matrix.target }}/SHA256SUMS.txt
          else
            shasum -a 256 release/${{ matrix.target }}.tar.gz > release/${{ matrix.target }}/SHA256SUMS.txt
          fi

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES_v0.1.9.md
          prerelease: true
          files: |
            release/${{ matrix.target }}.tar.gz
            release/${{ matrix.target }}/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    name: publish container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
