name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: cargo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "outcall"
          cache-on-failure: false

      - name: Clear stale hickory artifacts
        run: rm -rf ~/.cargo/registry/cache ~/.cargo/registry/src

      - name: cargo check
        run: cargo check --workspace --all-targets --locked

  test-unit:
    name: cargo test (unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "outcall-unit"
          cache-on-failure: false

      - name: cargo test
        run: cargo test --workspace --lib --bins --locked

  test-integration:
    name: cargo test (integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "outcall-integration"
          cache-on-failure: false

      - name: cargo build
        run: cargo build --workspace --locked

      - name: cargo test
        run: |
          export PATH="$PWD/target/debug:$PATH"
          cargo test --workspace --tests --locked

  test-privileged-sudo:
    name: cargo test (privileged e2e - sudo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "outcall-privileged-sudo"
          cache-on-failure: false

      - name: Set up outcall0 bridge with isolated subnet
        run: |
          sudo ip link del outcall0 2>/dev/null || true
          sudo ip link add outcall0 type bridge
          sudo ip addr add 172.30.0.1/24 dev outcall0
          sudo ip link set outcall0 up

      - name: cargo build
        run: cargo build --workspace --locked

      - name: cargo test --ignored (e2e tests via sudo)
        run: |
          sudo env \
            PATH=/home/runner/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/bin:$PWD/target/debug:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            RUSTC=/home/runner/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/bin/rustc \
            OUTCALL_PROXY_ADDR=172.30.0.1:8080 \
            /home/runner/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/bin/cargo test --workspace --tests -- --ignored --test-threads=1

  test-privileged-docker:
    name: cargo test (privileged e2e - docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run privileged e2e tests in container
        run: |
          docker run --rm \
            --cap-add=NET_ADMIN \
            --device /dev/net/tun:/dev/net/tun \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e OUTCALL_PROXY_ADDR=172.30.0.1:8080 \
            rust:latest \
            bash -c 'apt-get update && apt-get install -y nftables iproute2 && \
                     ip link del outcall0 2>/dev/null || true && \
                     ip link add outcall0 type bridge && \
                     ip addr add 172.30.0.1/24 dev outcall0 && \
                     ip link set outcall0 up && \
                     export PATH="$PWD/target/debug:$PATH" && \
                     cargo build --workspace --locked && \
                     cargo test --workspace --tests -- --ignored --test-threads=1'

  installer-smoke:
    name: installer smoke (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "outcall-installer-smoke"
          cache-on-failure: false

      - name: Build release binaries
        run: cargo build --release --workspace --locked

      - name: Package local release archive
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' outcall/Cargo.toml | head -n1)
          mkdir -p release-smoke/x86_64-unknown-linux-gnu
          cp target/release/outcall release-smoke/x86_64-unknown-linux-gnu/
          cp target/release/outcalld release-smoke/x86_64-unknown-linux-gnu/
          cp target/release/outcall-agent release-smoke/x86_64-unknown-linux-gnu/
          tar -czf release-smoke/x86_64-unknown-linux-gnu.tar.gz -C release-smoke/x86_64-unknown-linux-gnu .
          docker build \
            -t ghcr.io/outcall-dev/outcalld:v"$VERSION" \
            -t ghcr.io/outcall-dev/outcalld:latest \
            .
          docker save \
            ghcr.io/outcall-dev/outcalld:v"$VERSION" \
            ghcr.io/outcall-dev/outcalld:latest | gzip > release-smoke/outcalld-image-linux-amd64.tar.gz
          printf '%s' "$VERSION" > release-smoke/VERSION

      - name: Enable bridge netfilter
        run: |
          sudo modprobe br_netfilter || true
          sudo sysctl -w net.bridge.bridge-nf-call-iptables=1 || true
          sudo sysctl -w net.bridge.bridge-nf-call-ip6tables=1 || true

      - name: Install from local installer
        run: |
          VERSION=$(cat release-smoke/VERSION)
          export OUTCALL_VERSION="$VERSION"
          export OUTCALL_RELEASE_BASE_URL="file://$PWD/release-smoke"
          export OUTCALL_BIN_DIR="$RUNNER_TEMP/outcall-bin"
          sh scripts/install.sh
          "$OUTCALL_BIN_DIR/outcall" --version
          "$OUTCALL_BIN_DIR/outcalld" --version
          "$OUTCALL_BIN_DIR/outcall-agent" --version

      - name: Smoke test one-command Claude start
        run: |
          set -eu
          export PATH="$RUNNER_TEMP/outcall-bin:$PATH"
          export HOME="$RUNNER_TEMP/outcall-smoke-home-claude"
          rm -rf "$HOME"
          mkdir -p "$HOME"
          export ANTHROPIC_API_KEY=dummy-smoke-key
          unset CODEX_ACCESS_TOKEN CODEX_API_KEY
          project_dir="$RUNNER_TEMP/outcall-smoke-project"
          rm -rf "$project_dir"
          mkdir -p "$project_dir"
          cd "$project_dir"
          set +e
          timeout 180 outcall start -- --version
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::group::docker ps"
            docker ps -a || true
            echo "::endgroup::"
            echo "::group::daemon logs"
            docker logs outcall-daemon || true
            echo "::endgroup::"
            echo "::group::agent logs"
            docker logs claude-agent || true
            echo "::endgroup::"
            echo "::group::socket state"
            ls -la /tmp/outcall || true
            echo "::endgroup::"
            echo "::group::project scaffold"
            find .outcall -maxdepth 3 -type f | sort || true
            echo "::endgroup::"
            exit "$status"
          fi
          test -f .outcall/recipes/claude/recipe.yaml
          test -f .outcall/agent.yaml
          docker inspect claude-agent >/dev/null

      - name: Smoke test one-command Codex start
        run: |
          set -eu
          export PATH="$RUNNER_TEMP/outcall-bin:$PATH"
          export HOME="$RUNNER_TEMP/outcall-smoke-home-codex"
          rm -rf "$HOME"
          mkdir -p "$HOME"
          export CODEX_API_KEY=dummy-smoke-key
          unset ANTHROPIC_API_KEY CODEX_ACCESS_TOKEN
          project_dir="$RUNNER_TEMP/outcall-smoke-project-codex"
          rm -rf "$project_dir"
          mkdir -p "$project_dir"
          cd "$project_dir"
          set +e
          timeout 180 outcall start -- --version
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::group::docker ps"
            docker ps -a || true
            echo "::endgroup::"
            echo "::group::daemon logs"
            docker logs outcall-daemon || true
            echo "::endgroup::"
            echo "::group::agent logs"
            docker logs codex-agent || true
            echo "::endgroup::"
            echo "::group::socket state"
            ls -la /tmp/outcall || true
            echo "::endgroup::"
            echo "::group::project scaffold"
            find .outcall -maxdepth 3 -type f | sort || true
            echo "::endgroup::"
            exit "$status"
          fi
          test -f .outcall/recipes/codex/recipe.yaml
          test -f .outcall/agent.yaml
          docker inspect codex-agent >/dev/null

  secure-install-runtime:
    name: secure install + runtime + security validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl tar gzip iproute2 nftables iptables make

      - name: Build release binaries
        run: cargo build --release --workspace --locked

      - name: Build daemon image for local preload
        run: |
          set -eu
          ROOT_DIR="$(git rev-parse --show-toplevel)"
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' outcall/Cargo.toml | head -n1)"
          mkdir -p "$RUNNER_TEMP/outcall-ci-release"
          if [ -f "$ROOT_DIR/scripts/e2e/Dockerfile" ]; then
            DOCKERFILE="$ROOT_DIR/scripts/e2e/Dockerfile"
          elif [ -f "$ROOT_DIR/application/scripts/e2e/Dockerfile" ]; then
            DOCKERFILE="$ROOT_DIR/application/scripts/e2e/Dockerfile"
          elif [ -f "$ROOT_DIR/Dockerfile" ]; then
            DOCKERFILE="$ROOT_DIR/Dockerfile"
          elif [ -f "$ROOT_DIR/../application/scripts/e2e/Dockerfile" ]; then
            DOCKERFILE="$ROOT_DIR/../application/scripts/e2e/Dockerfile"
            ROOT_DIR="$(cd "$ROOT_DIR/.." && pwd)"
          elif [ -f "$ROOT_DIR/../Dockerfile" ]; then
            DOCKERFILE="$ROOT_DIR/../Dockerfile"
            ROOT_DIR="$(cd "$ROOT_DIR/.." && pwd)"
          else
            CANDIDATE=$(find "$ROOT_DIR" "$ROOT_DIR/.." -maxdepth 4 -type f \( -name Dockerfile -o -path '*/scripts/e2e/Dockerfile' \) | head -n 1)
            if [ -n "$CANDIDATE" ]; then
              DOCKERFILE="$CANDIDATE"
              if [[ "$DOCKERFILE" == */scripts/e2e/Dockerfile ]]; then
                ROOT_DIR="$(dirname "$(dirname "$DOCKERFILE")")"
              else
                ROOT_DIR="$(dirname "$DOCKERFILE")"
              fi
            else
              echo "No supported daemon Dockerfile found in repository."
              exit 1
            fi
          fi
          docker build -f "$DOCKERFILE" \
            -t "ghcr.io/outcall-dev/outcalld:v$VERSION" \
            -t "ghcr.io/outcall-dev/outcalld:latest" "$ROOT_DIR"
          docker save "ghcr.io/outcall-dev/outcalld:v$VERSION" | gzip > "$RUNNER_TEMP/outcall-ci-release/outcalld-image-linux-amd64.tar.gz"

      - name: Package local installer artifacts
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' outcall/Cargo.toml | head -n1)"
          mkdir -p "$RUNNER_TEMP/outcall-ci-release/x86_64-unknown-linux-gnu"
          cp target/release/outcall target/release/outcalld target/release/outcall-agent \
            "$RUNNER_TEMP/outcall-ci-release/x86_64-unknown-linux-gnu/"
          tar -czf "$RUNNER_TEMP/outcall-ci-release/x86_64-unknown-linux-gnu.tar.gz" \
            -C "$RUNNER_TEMP/outcall-ci-release/x86_64-unknown-linux-gnu" .

      - name: Enforce bridge netfilter (hard preflight requirement)
        run: |
          set -eu
          sudo modprobe br_netfilter
          sudo sysctl -w net.bridge.bridge-nf-call-iptables=1
          sudo sysctl -w net.bridge.bridge-nf-call-ip6tables=1
          IPV4="$(cat /proc/sys/net/bridge/bridge-nf-call-iptables | tr -d '[:space:]')"
          IPV6="$(cat /proc/sys/net/bridge/bridge-nf-call-ip6tables | tr -d '[:space:]')"
          [ "$IPV4" = "1" ] && [ "$IPV6" = "1" ] || {
            echo "bridge netfilter enforceable check failed: ipv4=$IPV4 ipv6=$IPV6"
            exit 1
          }

      - name: Install from local release artifacts
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' outcall/Cargo.toml | head -n1)"
          export OUTCALL_VERSION="$VERSION"
          export OUTCALL_RELEASE_BASE_URL="file://$RUNNER_TEMP/outcall-ci-release"
          export OUTCALL_BIN_DIR="$RUNNER_TEMP/outcall-bin"
          mkdir -p "$OUTCALL_BIN_DIR"
          sh scripts/install.sh
          "$OUTCALL_BIN_DIR/outcall" --version
          "$OUTCALL_BIN_DIR/outcalld" --version
          "$OUTCALL_BIN_DIR/outcall-agent" --version

      - name: Usage smoke (Claude)
        run: |
          set -eu
          export PATH="$RUNNER_TEMP/outcall-bin:$PATH"
          PROJECT_DIR="$RUNNER_TEMP/outcall-smoke-claude"
          HOME_DIR="$RUNNER_TEMP/outcall-smoke-home-claude"
          rm -rf "$PROJECT_DIR" "$HOME_DIR"
          mkdir -p "$PROJECT_DIR" "$HOME_DIR"
          export HOME="$HOME_DIR"
          export ANTHROPIC_API_KEY=dummy-smoke-key
          unset CODEX_API_KEY CODEX_ACCESS_TOKEN
          cd "$PROJECT_DIR"

          set +e
          timeout 180 outcall start -- --version
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::group::docker ps"
            docker ps -a || true
            echo "::endgroup::"
            echo "::group::daemon logs"
            docker logs outcall-daemon --tail 120 || true
            echo "::endgroup::"
            echo "::group::agent logs"
            docker logs claude-agent --tail 120 || true
            echo "::endgroup::"
            exit "$status"
          fi
          test -f .outcall/recipes/claude/recipe.yaml
          test -f .outcall/agent.yaml
          docker inspect claude-agent >/dev/null

      - name: Usage smoke (Codex)
        run: |
          set -eu
          export PATH="$RUNNER_TEMP/outcall-bin:$PATH"
          PROJECT_DIR="$RUNNER_TEMP/outcall-smoke-codex"
          HOME_DIR="$RUNNER_TEMP/outcall-smoke-home-codex"
          rm -rf "$PROJECT_DIR" "$HOME_DIR"
          mkdir -p "$PROJECT_DIR" "$HOME_DIR"
          export HOME="$HOME_DIR"
          export CODEX_API_KEY=dummy-smoke-key
          unset ANTHROPIC_API_KEY CODEX_ACCESS_TOKEN
          cd "$PROJECT_DIR"

          set +e
          timeout 180 outcall start -- --version
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::group::docker ps"
            docker ps -a || true
            echo "::endgroup::"
            echo "::group::daemon logs"
            docker logs outcall-daemon --tail 120 || true
            echo "::endgroup::"
            echo "::group::agent logs"
            docker logs codex-agent --tail 120 || true
            echo "::endgroup::"
            exit "$status"
          fi
          test -f .outcall/recipes/codex/recipe.yaml
          test -f .outcall/agent.yaml
          docker inspect codex-agent >/dev/null

      - name: Security integration (bridge state + leak checks)
        run: |
          ROOT_DIR="$(git rev-parse --show-toplevel)"
          CARGO_BIN="$(rustup which --toolchain "${RUSTUP_TOOLCHAIN:-stable}" cargo 2>/dev/null || true)"
          if [ -z "$CARGO_BIN" ] && command -v cargo >/dev/null 2>&1; then
            CARGO_BIN="$(command -v cargo)"
          fi
          CARGO_BIN_DIR="$(dirname "$CARGO_BIN")"
          if [ -f "$ROOT_DIR/scripts/test-bridge.sh" ] && [ -d "$ROOT_DIR/application" ]; then
            sudo bash "$ROOT_DIR/scripts/test-bridge.sh"
          else
            sudo env \
              PATH="$CARGO_BIN_DIR:$PATH" \
              RUSTC="$CARGO_BIN_DIR/rustc" \
              "$CARGO_BIN" test -p outcalld --test bridge_integration -- --nocapture
          fi

      - name: Security integration (container isolation)
        run: |
          ROOT_DIR="$(git rev-parse --show-toplevel)"
          CARGO_BIN="$(rustup which --toolchain "${RUSTUP_TOOLCHAIN:-stable}" cargo 2>/dev/null || true)"
          if [ -z "$CARGO_BIN" ] && command -v cargo >/dev/null 2>&1; then
            CARGO_BIN="$(command -v cargo)"
          fi
          CARGO_BIN_DIR="$(dirname "$CARGO_BIN")"
          if [ -f "$ROOT_DIR/Makefile" ]; then
            make build
            make stop >/dev/null 2>&1 || true
            if [ -f "$ROOT_DIR/scripts/test-isolation.sh" ] && [ -d "$ROOT_DIR/application" ]; then
              bash "$ROOT_DIR/scripts/test-isolation.sh" --skip-build
            else
              sudo env \
                PATH="$CARGO_BIN_DIR:$PATH" \
                RUSTC="$CARGO_BIN_DIR/rustc" \
                "$CARGO_BIN" test -p outcalld --test bridge_integration -- --test-threads=1 --nocapture
            fi
          else
            sudo env \
              PATH="$CARGO_BIN_DIR:$PATH" \
              RUSTC="$CARGO_BIN_DIR/rustc" \
              "$CARGO_BIN" test -p outcalld --test bridge_integration -- --test-threads=1 --nocapture
          fi

      - name: Verify preflight hard-fails when netfilter is disabled
        run: |
          set -eu
          export PATH="$RUNNER_TEMP/outcall-bin:$PATH"
          PROJECT_DIR="$RUNNER_TEMP/outcall-smoke-claude"
          cd "$PROJECT_DIR"
          sudo sysctl -w net.bridge.bridge-nf-call-iptables=0
          sudo sysctl -w net.bridge.bridge-nf-call-ip6tables=0
          set +e
          outcall recipe test claude --no-build > /tmp/outcall-preflight.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "preflight unexpectedly passed when bridge netfilter was disabled"
            echo "--- preflight output ---"
            cat /tmp/outcall-preflight.log
            exit 1
          fi
          grep -q "Secure unattended mode requires bridge netfilter enforcement" /tmp/outcall-preflight.log
          sudo sysctl -w net.bridge.bridge-nf-call-iptables=1
          sudo sysctl -w net.bridge.bridge-nf-call-ip6tables=1

  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "outcall"
          cache-on-failure: false

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -A warnings

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "outcall"
          cache-on-failure: false

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: cargo audit
        run: cargo audit

  geiger:
    name: cargo geiger (unsafe check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "outcall"
          cache-on-failure: false

      - name: Install cargo-geiger
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-geiger

      - name: cargo geiger (outcalld)
        run: cd outcalld && cargo geiger --all-targets || true

      - name: cargo geiger (outcall)
        run: cd outcall && cargo geiger --all-targets || true

      - name: cargo geiger (outcall-agent)
        run: cd outcall-agent && cargo geiger --all-targets || true

      - name: cargo geiger (outcall-api)
        run: cd outcall-api && cargo geiger --all-targets || true

      - name: cargo geiger (outcall-ui)
        run: cd outcall-ui && cargo geiger --all-targets || true

      - name: Check no unsafe code
        run: |
          if grep -r '#\[unsafe\]' outcalld/src/ --include='*.rs' 2>/dev/null; then
            echo 'Unsafe code found!'
            exit 1
          fi
          if grep -rn 'allow(unsafe' outcalld/src/ --include='*.rs' 2>/dev/null; then
            echo 'Unsafe allow annotations found!'
            exit 1
          fi
          echo "No unsafe code found — geiger check passed"

  deny:
    name: cargo deny (licenses + bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "outcall"
          cache-on-failure: false

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: cargo deny
        run: cargo deny check
