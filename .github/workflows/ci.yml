name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: cargo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "outcall"
          cache-on-failure: false

      - name: Clear stale hickory artifacts
        run: rm -rf ~/.cargo/registry/cache ~/.cargo/registry/src

      - name: cargo check
        run: cargo check --workspace --all-targets --locked

  test-unit:
    name: cargo test (unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "outcall-unit"
          cache-on-failure: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: cargo test
        run: cargo test --workspace --lib --bins --locked

      - name: Dashboard asset tests
        run: make ui-test

  test-integration:
    name: cargo test (integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "outcall-integration"
          cache-on-failure: false

      - name: cargo build
        run: cargo build --workspace --locked

      - name: cargo test
        run: |
          export PATH="$PWD/target/debug:$PATH"
          cargo test --workspace --tests --locked

  coverage:
    name: cargo llvm-cov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "outcall-coverage"
          cache-on-failure: false

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Measure coverage and enforce baseline
        run: make coverage

      - name: Upload LCOV report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: target/coverage/lcov.info
          if-no-files-found: warn

  spec-traceability:
    name: specification traceability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate implementation and test mappings
        run: make spec-check

  shell-quality:
    name: shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y shellcheck

      - name: Check shell scripts
        run: |
          shellcheck scripts/*.sh
          for script in scripts/*.sh; do
            case "$(head -n 1 "$script")" in
              '#!/usr/bin/env bash'|'#!/bin/bash') bash -n "$script" ;;
              '#!/usr/bin/env sh'|'#!/bin/sh') sh -n "$script" ;;
              *) echo "Unsupported shell shebang: $script" >&2; exit 1 ;;
            esac
          done

  test-privileged-sudo:
    name: cargo test (privileged e2e - sudo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "outcall-privileged-sudo"
          cache-on-failure: false

      - name: Set up outcall0 bridge with isolated subnet
        run: |
          sudo ip link del outcall0 2>/dev/null || true
          sudo ip link add outcall0 type bridge
          sudo ip addr add 172.30.0.1/24 dev outcall0
          sudo ip link set outcall0 up

      - name: cargo build
        run: cargo build --workspace --locked

      - name: cargo test --ignored (e2e tests via sudo)
        run: |
          sudo env \
            PATH=/home/runner/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/bin:$PWD/target/debug:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            RUSTC=/home/runner/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/bin/rustc \
            OUTCALL_PROXY_ADDR=172.30.0.1:8080 \
            /home/runner/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/bin/cargo test --workspace --tests -- --ignored --test-threads=1

  test-privileged-docker:
    name: cargo test (privileged e2e - docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run privileged e2e tests in container
        run: |
          docker run --rm \
            --cap-add=NET_ADMIN \
            --device /dev/net/tun:/dev/net/tun \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e OUTCALL_PROXY_ADDR=172.30.0.1:8080 \
            rust:1.88-bookworm \
            bash -c 'set -eu
                     apt-get update
                     apt-get install -y nftables iproute2
                     ip link del outcall0 2>/dev/null || true
                     ip link add outcall0 type bridge
                     ip addr add 172.30.0.1/24 dev outcall0
                     ip link set outcall0 up
                     export PATH="$PWD/target/debug:$PATH"
                     cargo build --workspace --locked
                     cargo test --workspace --tests -- --ignored --test-threads=1
                     OUTCALL_REQUIRE_PRIVILEGED_TESTS=1 \
                       cargo test -p outcalld --test bridge_integration -- \
                         --nocapture --test-threads=1'

  installer-smoke:
    name: installer smoke (linux)
    # Host-built binaries are placed in the Debian Bookworm daemon image.
    # Ubuntu 22.04's glibc is compatible with Bookworm; ubuntu-latest is not.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "outcall-installer-smoke"
          cache-on-failure: false

      - name: Build release binaries
        run: cargo build --release --workspace --locked

      - name: Package local release archive
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' outcall/Cargo.toml | head -n1)
          mkdir -p release-smoke/x86_64-unknown-linux-gnu
          cp target/release/outcall release-smoke/x86_64-unknown-linux-gnu/
          cp target/release/outcalld release-smoke/x86_64-unknown-linux-gnu/
          cp target/release/outcall-agent release-smoke/x86_64-unknown-linux-gnu/
          tar -czf release-smoke/x86_64-unknown-linux-gnu.tar.gz -C release-smoke/x86_64-unknown-linux-gnu .
          sha256sum release-smoke/x86_64-unknown-linux-gnu.tar.gz > release-smoke/x86_64-unknown-linux-gnu.tar.gz.sha256
          sh scripts/build-local-daemon-image.sh release-smoke
          printf '%s' "$VERSION" > release-smoke/VERSION

      - name: Enable bridge netfilter
        run: |
          sudo modprobe br_netfilter || true
          sudo sysctl -w net.bridge.bridge-nf-call-iptables=1 || true
          sudo sysctl -w net.bridge.bridge-nf-call-ip6tables=1 || true

      - name: Install from local installer
        run: |
          VERSION=$(cat release-smoke/VERSION)
          export OUTCALL_VERSION="$VERSION"
          export OUTCALL_RELEASE_BASE_URL="file://$PWD/release-smoke"
          export OUTCALL_BIN_DIR="$RUNNER_TEMP/outcall-bin"
          sh scripts/install.sh
          "$OUTCALL_BIN_DIR/outcall" --version
          "$OUTCALL_BIN_DIR/outcalld" --version
          "$OUTCALL_BIN_DIR/outcall-agent" --version

      - name: Smoke test one-command Claude start
        run: |
          set -eu
          export PATH="$RUNNER_TEMP/outcall-bin:$PATH"
          export HOME="$RUNNER_TEMP/outcall-smoke-home-claude"
          rm -rf "$HOME"
          mkdir -p "$HOME"
          export CLAUDE_CODE_OAUTH_TOKEN=dummy-smoke-token
          unset ANTHROPIC_API_KEY ANTHROPIC_AUTH_TOKEN
          unset CODEX_ACCESS_TOKEN CODEX_API_KEY
          project_dir="$RUNNER_TEMP/outcall-smoke-project"
          agent_name="$(basename "$project_dir")-1"
          rm -rf "$project_dir"
          mkdir -p "$project_dir"
          cd "$project_dir"
          set +e
          timeout 300 outcall run claude --keep -- --version
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::group::docker ps"
            docker ps -a || true
            echo "::endgroup::"
            echo "::group::daemon logs"
            docker logs outcall-daemon || true
            echo "::endgroup::"
            echo "::group::agent logs"
            docker logs "$agent_name" || true
            echo "::endgroup::"
            echo "::group::socket state"
            ls -la /tmp/outcall || true
            echo "::endgroup::"
            echo "::group::project scaffold"
            find .outcall -maxdepth 3 -type f | sort || true
            echo "::endgroup::"
            exit "$status"
          fi
          test -f .outcall/recipes/claude/recipe.yaml
          test -f .outcall/agent.yaml
          docker inspect "$agent_name" >/dev/null

      - name: Smoke test one-command Codex start
        run: |
          set -eu
          export PATH="$RUNNER_TEMP/outcall-bin:$PATH"
          export HOME="$RUNNER_TEMP/outcall-smoke-home-codex"
          rm -rf "$HOME"
          mkdir -p "$HOME"
          export CODEX_API_KEY=dummy-smoke-key
          unset CLAUDE_CODE_OAUTH_TOKEN ANTHROPIC_API_KEY ANTHROPIC_AUTH_TOKEN CODEX_ACCESS_TOKEN
          project_dir="$RUNNER_TEMP/outcall-smoke-project-codex"
          agent_name="$(basename "$project_dir")-1"
          rm -rf "$project_dir"
          mkdir -p "$project_dir"
          cd "$project_dir"
          set +e
          timeout 300 outcall run codex --keep -- --version
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::group::docker ps"
            docker ps -a || true
            echo "::endgroup::"
            echo "::group::daemon logs"
            docker logs outcall-daemon || true
            echo "::endgroup::"
            echo "::group::agent logs"
            docker logs "$agent_name" || true
            echo "::endgroup::"
            echo "::group::socket state"
            ls -la /tmp/outcall || true
            echo "::endgroup::"
            echo "::group::project scaffold"
            find .outcall -maxdepth 3 -type f | sort || true
            echo "::endgroup::"
            exit "$status"
          fi
          test -f .outcall/recipes/codex/recipe.yaml
          test -f .outcall/agent.yaml
          docker inspect "$agent_name" >/dev/null

  secure-install-runtime:
    name: secure install + runtime + security validation
    # Keep host-built binaries compatible with the Debian Bookworm runtime image.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install runtime dependencies
        timeout-minutes: 8
        run: |
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            install -y --no-install-recommends \
            curl tar gzip iproute2 nftables iptables make

      - name: Build release binaries
        run: cargo build --release --workspace --locked

      - name: Build daemon image for local preload
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/outcall-ci-release"
          sh scripts/build-local-daemon-image.sh "$RUNNER_TEMP/outcall-ci-release"

      - name: Package local installer artifacts
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' outcall/Cargo.toml | head -n1)"
          mkdir -p "$RUNNER_TEMP/outcall-ci-release/x86_64-unknown-linux-gnu"
          cp target/release/outcall target/release/outcalld target/release/outcall-agent \
            "$RUNNER_TEMP/outcall-ci-release/x86_64-unknown-linux-gnu/"
          tar -czf "$RUNNER_TEMP/outcall-ci-release/x86_64-unknown-linux-gnu.tar.gz" \
            -C "$RUNNER_TEMP/outcall-ci-release/x86_64-unknown-linux-gnu" .
          sha256sum "$RUNNER_TEMP/outcall-ci-release/x86_64-unknown-linux-gnu.tar.gz" > "$RUNNER_TEMP/outcall-ci-release/x86_64-unknown-linux-gnu.tar.gz.sha256"

      - name: Enforce bridge netfilter (hard preflight requirement)
        run: |
          set -eu
          sudo modprobe br_netfilter
          sudo sysctl -w net.bridge.bridge-nf-call-iptables=1
          sudo sysctl -w net.bridge.bridge-nf-call-ip6tables=1
          IPV4="$(cat /proc/sys/net/bridge/bridge-nf-call-iptables | tr -d '[:space:]')"
          IPV6="$(cat /proc/sys/net/bridge/bridge-nf-call-ip6tables | tr -d '[:space:]')"
          [ "$IPV4" = "1" ] && [ "$IPV6" = "1" ] || {
            echo "bridge netfilter enforceable check failed: ipv4=$IPV4 ipv6=$IPV6"
            exit 1
          }

      - name: Install from local release artifacts
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' outcall/Cargo.toml | head -n1)"
          export OUTCALL_VERSION="$VERSION"
          export OUTCALL_RELEASE_BASE_URL="file://$RUNNER_TEMP/outcall-ci-release"
          export OUTCALL_BIN_DIR="$RUNNER_TEMP/outcall-bin"
          mkdir -p "$OUTCALL_BIN_DIR"
          sh scripts/install.sh
          "$OUTCALL_BIN_DIR/outcall" --version
          "$OUTCALL_BIN_DIR/outcalld" --version
          "$OUTCALL_BIN_DIR/outcall-agent" --version

      - name: Usage smoke (Claude)
        run: |
          set -eu
          export PATH="$RUNNER_TEMP/outcall-bin:$PATH"
          PROJECT_DIR="$RUNNER_TEMP/outcall-smoke-claude"
          HOME_DIR="$RUNNER_TEMP/outcall-smoke-home-claude"
          AGENT_NAME="$(basename "$PROJECT_DIR")-1"
          rm -rf "$PROJECT_DIR" "$HOME_DIR"
          mkdir -p "$PROJECT_DIR" "$HOME_DIR"
          export HOME="$HOME_DIR"
          export CLAUDE_CODE_OAUTH_TOKEN=dummy-smoke-token
          unset ANTHROPIC_API_KEY ANTHROPIC_AUTH_TOKEN
          unset CODEX_API_KEY CODEX_ACCESS_TOKEN
          cd "$PROJECT_DIR"

          set +e
          timeout 300 outcall run claude --keep -- --version
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::group::docker ps"
            docker ps -a || true
            echo "::endgroup::"
            echo "::group::daemon logs"
            docker logs outcall-daemon --tail 120 || true
            echo "::endgroup::"
            echo "::group::agent logs"
            docker logs "$AGENT_NAME" --tail 120 || true
            echo "::endgroup::"
            exit "$status"
          fi
          test -f .outcall/recipes/claude/recipe.yaml
          test -f .outcall/agent.yaml
          docker inspect "$AGENT_NAME" >/dev/null

      - name: Usage smoke (Codex)
        run: |
          set -eu
          export PATH="$RUNNER_TEMP/outcall-bin:$PATH"
          PROJECT_DIR="$RUNNER_TEMP/outcall-smoke-codex"
          HOME_DIR="$RUNNER_TEMP/outcall-smoke-home-codex"
          AGENT_NAME="$(basename "$PROJECT_DIR")-1"
          rm -rf "$PROJECT_DIR" "$HOME_DIR"
          mkdir -p "$PROJECT_DIR" "$HOME_DIR"
          export HOME="$HOME_DIR"
          export CODEX_API_KEY=dummy-smoke-key
          unset CLAUDE_CODE_OAUTH_TOKEN ANTHROPIC_API_KEY ANTHROPIC_AUTH_TOKEN CODEX_ACCESS_TOKEN
          cd "$PROJECT_DIR"

          set +e
          timeout 300 outcall run codex --keep -- --version
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::group::docker ps"
            docker ps -a || true
            echo "::endgroup::"
            echo "::group::daemon logs"
            docker logs outcall-daemon --tail 120 || true
            echo "::endgroup::"
            echo "::group::agent logs"
            docker logs "$AGENT_NAME" --tail 120 || true
            echo "::endgroup::"
            exit "$status"
          fi
          test -f .outcall/recipes/codex/recipe.yaml
          test -f .outcall/agent.yaml
          docker inspect "$AGENT_NAME" >/dev/null

      - name: Security integration (container isolation)
        run: scripts/test-container-isolation.sh

      - name: Security integration (managed container profile)
        run: |
          scripts/test-managed-container-security.sh \
            outcall-smoke-claude-1 \
            outcall-smoke-codex-1

      - name: Security integration (egress policy)
        run: |
          OUTCALL_BIN="$RUNNER_TEMP/outcall-bin/outcall" \
            scripts/test-egress-policy.sh

      - name: Security integration (daemon outage fails closed)
        run: scripts/test-daemon-outage-fail-closed.sh

      - name: Verify preflight hard-fails when netfilter is disabled
        run: |
          OUTCALL_BIN="$RUNNER_TEMP/outcall-bin/outcall" \
            scripts/test-netfilter-preflight.sh \
              "$RUNNER_TEMP/outcall-smoke-codex" codex

  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "outcall"
          cache-on-failure: false

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Production targets do not panic on recoverable errors
        run: cargo clippy --workspace --lib --bins --locked -- -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic -D clippy::let_underscore_must_use -D clippy::let_underscore_future -D clippy::zombie_processes -D clippy::unused_io_amount

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "outcall"
          cache-on-failure: false

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: cargo audit
        run: cargo audit

  unsafe-policy:
    name: first-party unsafe policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "outcall"
          cache-on-failure: false

      - name: Compile every first-party target with unsafe code forbidden
        run: cargo check --workspace --all-targets --locked

  deny:
    name: cargo deny (licenses + bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "outcall"
          cache-on-failure: false

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: cargo deny
        run: cargo deny check
