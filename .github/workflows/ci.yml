name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: cargo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "outcall"
          cache-on-failure: false

      - name: Clear stale hickory artifacts
        run: rm -rf ~/.cargo/registry/cache ~/.cargo/registry/src

      - name: cargo check
        run: cargo check --workspace --all-targets --locked

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "outcall"
          cache-on-failure: false

      - name: cargo test
        run: cargo test --workspace --all-targets --locked

  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "outcall"
          cache-on-failure: false

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -A warnings

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "outcall"
          cache-on-failure: false

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: cargo audit
        run: cargo audit

  geiger:
    name: cargo geiger (unsafe check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "outcall"
          cache-on-failure: false

      - name: Install cargo-geiger
        uses: taiki-e/install-action@cargo-geiger

      - name: cargo geiger (outcalld)
        run: cd outcalld && cargo geiger --all-targets || true

      - name: cargo geiger (outcall)
        run: cd outcall && cargo geiger --all-targets || true

      - name: cargo geiger (outcall-agent)
        run: cd outcall-agent && cargo geiger --all-targets || true

      - name: cargo geiger (outcall-api)
        run: cd outcall-api && cargo geiger --all-targets || true

      - name: cargo geiger (outcall-ui)
        run: cd outcall-ui && cargo geiger --all-targets || true

      - name: Check no unsafe code
        run: |
          if grep -r '#\[unsafe\]' outcalld/src/ --include='*.rs' 2>/dev/null; then
            echo 'Unsafe code found!'
            exit 1
          fi
          if grep -rn 'allow(unsafe' outcalld/src/ --include='*.rs' 2>/dev/null; then
            echo 'Unsafe allow annotations found!'
            exit 1
          fi
          echo "No unsafe code found — geiger check passed"

  deny:
    name: cargo deny (licenses + bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "outcall"
          cache-on-failure: false

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: cargo deny
        run: cargo deny check
